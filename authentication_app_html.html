<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Portal Authentication</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom Styles for Animations -->
    <style>
        /* Ambient Drifting Orbs Animations */
        @keyframes drift-1 {
            0% { transform: translate(0, 0) scale(1); opacity: 0.2; }
            33% { transform: translate(30px, -50px) scale(1.1); opacity: 0.3; }
            66% { transform: translate(-20px, 20px) scale(0.9); opacity: 0.15; }
            100% { transform: translate(0, 0) scale(1); opacity: 0.2; }
        }
        
        @keyframes drift-2 {
            0% { transform: translate(0, 0) scale(1); opacity: 0.2; }
            50% { transform: translate(-40px, 30px) scale(1.05); opacity: 0.25; }
            100% { transform: translate(0, 0) scale(1); opacity: 0.2; }
        }

        .orb-1 { animation: drift-1 15s ease-in-out infinite; }
        .orb-2 { animation: drift-2 18s ease-in-out infinite reverse; }
        .orb-3 { animation: drift-1 20s ease-in-out infinite 5s; }

        /* 3D Hardware Acceleration & Smooth Transitions */
        #glass-card {
            transition: transform 0.2s ease-out, box-shadow 0.2s ease-out;
            transform-style: preserve-3d;
        }

        /* Initial View States */
        #dashboard-view, #auth-view, #error-banner {
            display: none;
        }

        /* 3D Depth classes applied to children */
        .depth-20 { transform: translateZ(20px); }
        .depth-30 { transform: translateZ(30px); }
    </style>
</head>
<body class="min-h-screen bg-neutral-950 flex items-center justify-center p-4 relative overflow-hidden font-sans selection:bg-purple-500/30 text-white">

    <!-- Ambient Drifting Orbs -->
    <div class="orb-1 absolute top-[-10%] left-[-10%] w-[600px] h-[600px] bg-purple-700 rounded-full blur-[120px] mix-blend-screen pointer-events-none"></div>
    <div class="orb-2 absolute bottom-[-10%] right-[-10%] w-[600px] h-[600px] bg-blue-700 rounded-full blur-[120px] mix-blend-screen pointer-events-none"></div>
    <div class="orb-3 absolute top-[40%] left-[50%] -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-indigo-900/50 rounded-full blur-[150px] mix-blend-screen pointer-events-none"></div>

    <!-- Main Container with Perspective for 3D Effect -->
    <div id="card-container" class="relative z-10 w-full max-w-md perspective-[1200px]" style="perspective: 1200px;">
        
        <!-- Glassmorphism Card -->
        <div id="glass-card" class="w-full bg-white/5 backdrop-blur-2xl border border-white/10 rounded-3xl shadow-2xl p-8 md:p-10" style="box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 20px rgba(139, 92, 246, 0.05);">
            
            <!-- Loading Spinner -->
            <div id="loading-view" class="flex flex-col items-center justify-center py-10 depth-20">
                <i data-lucide="loader-2" class="w-10 h-10 text-purple-500 animate-spin"></i>
                <p class="mt-4 text-neutral-400 text-sm">Initializing Secure Environment...</p>
            </div>

            <!-- Authenticated Dashboard View -->
            <div id="dashboard-view" class="flex-col items-center text-center space-y-6 depth-30">
                <div class="relative flex justify-center">
                    <div class="absolute inset-0 bg-emerald-500 blur-xl opacity-20 rounded-full"></div>
                    <div class="w-20 h-20 bg-gradient-to-tr from-emerald-500/20 to-emerald-400/10 border border-emerald-500/30 rounded-2xl flex items-center justify-center shadow-lg relative z-10">
                        <i data-lucide="shield-check" class="w-10 h-10 text-emerald-400"></i>
                    </div>
                </div>
                
                <div class="space-y-2">
                    <h2 class="text-2xl font-bold text-white tracking-tight">Access Granted</h2>
                    <p class="text-sm text-neutral-400">
                        Secure session active for <br/>
                        <span id="user-email-display" class="text-purple-300 font-medium">user@example.com</span>
                    </p>
                </div>

                <div class="w-full h-px bg-gradient-to-r from-transparent via-white/10 to-transparent my-6"></div>

                <button id="logout-btn" class="group relative w-full flex items-center justify-center gap-2 py-3 px-4 bg-white/5 hover:bg-white/10 border border-white/10 text-white rounded-xl font-medium transition-all cursor-pointer">
                    <i data-lucide="log-out" class="w-4 h-4 text-neutral-400 group-hover:text-white transition-colors"></i>
                    Sign Out Securely
                </button>
            </div>

            <!-- Authentication Form View -->
            <div id="auth-view" class="depth-20">
                
                <div class="text-center mb-8">
                    <div class="inline-flex items-center justify-center p-3 bg-purple-500/10 rounded-2xl mb-4 border border-purple-500/20 shadow-inner">
                        <i data-lucide="lock" class="w-6 h-6 text-purple-400"></i>
                    </div>
                    <h1 id="form-title" class="text-3xl font-bold tracking-tight text-white mb-2">Welcome Back</h1>
                    <p id="form-subtitle" class="text-sm text-neutral-400">Authenticate to access your secure portal</p>
                </div>

                <form id="auth-form" class="space-y-5">
                    <div class="space-y-1.5">
                        <label class="text-xs font-semibold text-neutral-300 uppercase tracking-wider pl-1">Email Address</label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i data-lucide="mail" class="w-5 h-5 text-neutral-500 group-focus-within:text-purple-400 transition-colors"></i>
                            </div>
                            <input type="email" id="email-input" required class="w-full pl-11 pr-4 py-3.5 bg-black/40 border border-white/10 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500/50 focus:border-purple-500/50 text-white placeholder-neutral-600 transition-all backdrop-blur-sm" placeholder="admin@secure.net">
                        </div>
                    </div>

                    <div class="space-y-1.5">
                        <label class="text-xs font-semibold text-neutral-300 uppercase tracking-wider pl-1">Password</label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i data-lucide="lock" class="w-5 h-5 text-neutral-500 group-focus-within:text-purple-400 transition-colors"></i>
                            </div>
                            <input type="password" id="password-input" required class="w-full pl-11 pr-4 py-3.5 bg-black/40 border border-white/10 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500/50 focus:border-purple-500/50 text-white placeholder-neutral-600 transition-all backdrop-blur-sm" placeholder="••••••••">
                        </div>
                    </div>

                    <!-- Error Banner -->
                    <div id="error-banner" class="items-start space-x-3 text-rose-300 bg-rose-500/10 p-3.5 rounded-xl border border-rose-500/20">
                        <i data-lucide="alert-circle" class="w-5 h-5 flex-shrink-0 mt-0.5"></i>
                        <p id="error-message" class="text-sm font-medium leading-relaxed">Error message here.</p>
                    </div>

                    <button type="submit" id="submit-btn" class="group relative w-full flex items-center justify-center gap-2 py-3.5 px-4 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white rounded-xl font-semibold transition-all shadow-lg shadow-purple-500/25 disabled:opacity-70 disabled:cursor-not-allowed overflow-hidden mt-2">
                        <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform ease-out duration-300"></div>
                        <span class="relative flex items-center gap-2">
                            <span id="submit-text">Authenticate</span>
                            <i data-lucide="arrow-right" id="submit-icon" class="w-4 h-4 opacity-70 group-hover:translate-x-1 transition-transform"></i>
                            <i data-lucide="loader-2" id="submit-loader" class="w-5 h-5 animate-spin hidden"></i>
                        </span>
                    </button>
                </form>

                <div class="mt-8 text-center">
                    <p class="text-sm text-neutral-400">
                        <span id="toggle-prompt">Need to establish identity?</span>
                        <button type="button" id="toggle-mode-btn" class="ml-2 text-purple-400 hover:text-purple-300 font-medium focus:outline-none focus:underline underline-offset-4 transition-colors">
                            Sign Up
                        </button>
                    </p>
                </div>
            </div>

        </div>
    </div>

    <!-- Firebase and Logic via Module Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // --- Configuration ---
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : { apiKey: "demo", authDomain: "demo.firebaseapp.com" }; // Fallback config
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // --- State ---
        let isSignUp = false;
        let isLoading = false;

        // --- DOM Elements ---
        const container = document.getElementById('card-container');
        const card = document.getElementById('glass-card');
        
        // Views
        const loadingView = document.getElementById('loading-view');
        const authView = document.getElementById('auth-view');
        const dashboardView = document.getElementById('dashboard-view');
        
        // Auth Form Elements
        const authForm = document.getElementById('auth-form');
        const emailInput = document.getElementById('email-input');
        const passwordInput = document.getElementById('password-input');
        const formTitle = document.getElementById('form-title');
        const formSubtitle = document.getElementById('form-subtitle');
        const togglePrompt = document.getElementById('toggle-prompt');
        const toggleModeBtn = document.getElementById('toggle-mode-btn');
        const submitText = document.getElementById('submit-text');
        const submitIcon = document.getElementById('submit-icon');
        const submitLoader = document.getElementById('submit-loader');
        const submitBtn = document.getElementById('submit-btn');
        
        // Error Elements
        const errorBanner = document.getElementById('error-banner');
        const errorMessageEl = document.getElementById('error-message');
        
        // Dashboard Elements
        const userEmailDisplay = document.getElementById('user-email-display');
        const logoutBtn = document.getElementById('logout-btn');

        // --- Initialize Icons ---
        lucide.createIcons();

        // --- 3D Tilt Effect ---
        container.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const multiplier = 15; // Max rotation degrees
            const xRot = ((y - rect.height / 2) / rect.height) * -multiplier;
            const yRot = ((x - rect.width / 2) / rect.width) * multiplier;
            
            card.style.transform = `rotateX(${xRot}deg) rotateY(${yRot}deg)`;
            card.style.boxShadow = `0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 20px rgba(139, 92, 246, 0.15)`;
        });

        container.addEventListener('mouseleave', () => {
            card.style.transform = `rotateX(0deg) rotateY(0deg)`;
            card.style.boxShadow = `0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 20px rgba(139, 92, 246, 0.05)`;
        });

        // --- UI Updates ---
        function updateUIState() {
            // Update Text based on Mode
            formTitle.textContent = isSignUp ? 'Create Account' : 'Welcome Back';
            formSubtitle.textContent = isSignUp ? 'Enter your details to establish a secure identity' : 'Authenticate to access your secure portal';
            submitText.textContent = isSignUp ? 'Initialize Profile' : 'Authenticate';
            togglePrompt.textContent = isSignUp ? 'Already hold credentials?' : 'Need to establish identity?';
            toggleModeBtn.textContent = isSignUp ? 'Sign In' : 'Sign Up';

            // Reset Errors and form
            errorBanner.style.display = 'none';
            emailInput.value = '';
            passwordInput.value = '';
        }

        function setFormLoading(loading) {
            isLoading = loading;
            submitBtn.disabled = loading;
            if (loading) {
                submitText.textContent = 'Authenticating...';
                submitIcon.classList.add('hidden');
                submitLoader.classList.remove('hidden');
            } else {
                submitText.textContent = isSignUp ? 'Initialize Profile' : 'Authenticate';
                submitIcon.classList.remove('hidden');
                submitLoader.classList.add('hidden');
            }
        }

        function showError(message) {
            errorMessageEl.textContent = message;
            errorBanner.style.display = 'flex';
        }

        function showView(viewName) {
            loadingView.style.display = 'none';
            authView.style.display = 'none';
            dashboardView.style.display = 'none';

            if (viewName === 'loading') loadingView.style.display = 'flex';
            else if (viewName === 'auth') authView.style.display = 'block';
            else if (viewName === 'dashboard') dashboardView.style.display = 'flex';
            
            // Re-render icons for newly visible elements
            lucide.createIcons();
        }

        // --- Event Listeners ---
        
        // Toggle Login / Signup Mode
        toggleModeBtn.addEventListener('click', () => {
            isSignUp = !isSignUp;
            updateUIState();
        });

        // Handle Form Submission
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value;
            const password = passwordInput.value;

            if (!email || !password) {
                showError("Please fill in all fields.");
                return;
            }

            setFormLoading(true);
            errorBanner.style.display = 'none';

            try {
                if (isSignUp) {
                    await createUserWithEmailAndPassword(auth, email, password);
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
                // Success - onAuthStateChanged will handle the view switch
            } catch (error) {
                console.error("Auth Error:", error);
                
                // Parse Firebase Error Codes
                let friendlyMessage = 'Authentication failed. Please try again.';
                switch (error.code) {
                    case 'auth/invalid-credential':
                    case 'auth/user-not-found':
                    case 'auth/wrong-password':
                        friendlyMessage = 'Invalid email or password.'; break;
                    case 'auth/email-already-in-use':
                        friendlyMessage = 'An account with this email already exists.'; break;
                    case 'auth/weak-password':
                        friendlyMessage = 'Password should be at least 6 characters.'; break;
                    case 'auth/invalid-email':
                        friendlyMessage = 'Please enter a valid email address.'; break;
                }
                showError(friendlyMessage);
                setFormLoading(false);
            }
        });

        // Handle Logout
        logoutBtn.addEventListener('click', async () => {
            try {
                await signOut(auth);
            } catch (error) {
                console.error("Logout Error:", error);
            }
        });

        // --- Firebase Auth State Listener ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                userEmailDisplay.textContent = user.email;
                showView('dashboard');
            } else {
                updateUIState();
                setFormLoading(false);
                showView('auth');
            }
        });

    </script>
</body>
</html>
